apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow Simple test
on:
  workflow_dispatch:
    inputs:
      par1:
        type: string
        default: "mlcb_input_par"
jobs:
  edge_mlcb-macos-arm64:
    with:
      script: |
        echo "Hello world! I'm $(whoami) on $(hostname)"
        
        echo "\033[0;31m Inputs context \033[0m"
        echo "${{ inputs.par1 }}"

        echo "\033[0;31m Vars context \033[0m"
        echo "${{ vars.testpropertymlcb4 }}"

        echo "\033[0;31m CloudBees context \033[0m"
        echo "${{ toJSON(cloudbees) }}"
      labels: my-label-1
    delegates: https://github.com/dwnusbaum/pipeline-library-testing/custom-job.yml